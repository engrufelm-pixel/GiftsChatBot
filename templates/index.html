<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Консультант gifts.ru</title>

<style>
body { margin:0; font-family: Arial, sans-serif; }

#chat-button {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 60px;
    height: 60px;
    background: #a6ce39;
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

#chat-window {
    position: fixed;
    bottom: 90px;
    right: 20px;
    width: 400px;
    height: 550px;
    background:white;
    border-radius:15px;
    display:none;
    flex-direction:column;
    box-shadow:0 0 20px rgba(0,0,0,0.2);
}

#chat-header {
    background:#a6ce39;
    padding:15px;
    font-weight:bold;
    display:flex;
    justify-content:space-between;
}

#chat-messages {
    flex:1;
    padding:15px;
    overflow-y:auto;
    background:#f5f5f5;
}

.message {
    margin-bottom:10px;
    padding:10px;
    border-radius:10px;
}

.user {
    background:#a6ce39;
    align-self:flex-end;
}

.bot {
    background:#ffffff;
}

.typing {
    font-style: italic;
    opacity: 0.6;
}

#chat-input-area {
    display:flex;
}

#chat-input {
    flex:1;
    padding:12px;
    border:none;
    outline:none;
}

#send-btn {
    background:#a6ce39;
    border:none;
    padding:12px;
    cursor:pointer;
}
</style>
</head>
<body>

<div id="chat-button" onclick="toggleChat()">🎁</div>

<div id="chat-window">
    <div id="chat-header">
        Консультант gifts.ru
        <span onclick="toggleChat()">✕</span>
    </div>

    <div id="chat-messages">
        <div class="message bot">Здравствуйте! Напишите бюджет и кому нужен подарок 🎁</div>
    </div>

    <div id="chat-input-area">
        <input type="text" id="chat-input"
        placeholder="Например: подборка для топ-менеджеров до 5000"
        onkeypress="if(event.key==='Enter') sendMessage()">
        <button id="send-btn" onclick="sendMessage()">➤</button>
    </div>
</div>

<script>
function toggleChat(){
    const win=document.getElementById("chat-window");
    win.style.display = win.style.display==="flex" ? "none" : "flex";
}

function scrollToBottom(){
    const messages = document.getElementById("chat-messages");
    messages.scrollTop = messages.scrollHeight;
}

async function sendMessage(){
    const input=document.getElementById("chat-input");
    const messages=document.getElementById("chat-messages");
    const text=input.value.trim();
    if(!text) return;

    messages.innerHTML += `<div class="message user">${text}</div>`;
    input.value="";
    scrollToBottom();

    const typingElement = document.createElement("div");
    typingElement.className = "message bot typing";
    typingElement.id = "typing";
    typingElement.innerText = "Печатает...";
    messages.appendChild(typingElement);
    scrollToBottom();

    const response=await fetch("/chat",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({message:text})
    });

    const data=await response.json();

    document.getElementById("typing").remove();

    messages.innerHTML += `<div class="message bot">${data.reply.replace(/\n/g,"<br>")}</div>`;
    scrollToBottom();
}
</script>

</body>
</html>
